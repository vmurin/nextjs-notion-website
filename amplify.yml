version: 1
frontend:
    phases:
        preBuild:
            commands:
                - corepack enable pnpm
                - pnpm install --frozen-lockfile
        build:
            commands:
                - env | grep -e REDIS_ >> .env.production
                - env | grep -e NEXT_PUBLIC_ >> .env.production
                - env | grep -e NOTION_TOKEN >> .env.production
                - pnpm build
    artifacts:
        baseDirectory: .next
        files:
            - '**/*'
    cache:
        paths:
            - '.next/cache/**/*'
            - 'node_modules/**/*'
